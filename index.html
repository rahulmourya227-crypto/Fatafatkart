<!doctype html>
<html lang="en">
  <head>
    <link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#EF5350" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FatafatKart — Groceries in 10 minutes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      window.addEventListener("error", function (e) {
        var el = document.createElement("div");
        el.style.cssText =
          "position:fixed;top:0;left:0;right:0;background:#B23A2F;color:white;padding:14px;font-family:monospace;z-index:99999;white-space:pre-wrap;font-size:13px;line-height:1.4;";
        el.textContent =
          "EARLY JS ERROR: " + e.message + "\nFile: " + e.filename + " Line: " + e.lineno;
        document.body.appendChild(el);
      });
      window.addEventListener("unhandledrejection", function (e) {
        var el = document.createElement("div");
        el.style.cssText =
          "position:fixed;top:0;left:0;right:0;background:#B23A2F;color:white;padding:14px;font-family:monospace;z-index:99999;white-space:pre-wrap;font-size:13px;line-height:1.4;";
        el.textContent = "EARLY PROMISE ERROR: " + (e.reason && e.reason.message ? e.reason.message : e.reason);
        document.body.appendChild(el);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
